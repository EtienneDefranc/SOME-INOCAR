<!DOCTYPE html>
<html lang="es-EC" data-tema="claro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="SOME — Sistema de Observación del Mar Equinoccial. Prototipo demostrativo para el INOCAR con datos reales de NOAA OISST v2.1 (temperatura superficial del mar e índice Niño 1+2), Copernicus Marine (variables físicas del océano) y CHIRPS v3 (precipitación), con respaldo simulado señalado.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#0B4F6C">
  <title>SOME · Sistema de Observación del Mar Equinoccial</title>
  <link rel="icon" type="image/svg+xml" href="img/logo-some.svg">

  <!-- Tipografía Inter (con respaldo del sistema si no hay conexión) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">

  <!-- Leaflet 1.9.4 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <!-- Plotly 2.35.2 -->
  <script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js" crossorigin="anonymous"></script>
  <!-- Iconos: Flaticon UIcons 3.0.0, estilo regular redondeado («Uicons by Flaticon», crédito en «Acerca de») -->
  <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/3.0.0/uicons-regular-rounded/css/uicons-regular-rounded.css">

  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="capa">
    <!-- Barra lateral -->
    <aside class="lateral" id="lateral" aria-label="Navegación principal">
      <a class="lateral-logo" href="#/panel" title="SOME — Panel personal">
        <img src="img/logo-some.svg" alt="Logotipo del SOME">
        <div>
          <strong>SOME</strong>
          <small>Sistema de Observación del Mar Equinoccial</small>
        </div>
      </a>
      <nav class="lateral-nav" id="lateral-nav"></nav>
      <div class="lateral-pie" id="lateral-pie"></div>
    </aside>
    <div class="sobreposicion-movil" id="sobreposicion-movil" aria-hidden="true"></div>

    <!-- Zona principal -->
    <div class="principal">
      <header class="cabecera">
        <button type="button" class="boton boton-icono boton-fantasma" id="boton-lateral" aria-label="Mostrar u ocultar la barra lateral" title="Barra lateral">
          <svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div class="cabecera-titulos">
          <h1 id="cabecera-titulo">SOME</h1>
          <div class="migas" id="cabecera-migas"><span>SOME</span></div>
        </div>
        <div class="cabecera-acciones">
          <!-- Texto provisional hasta que llega el catálogo: la procedencia (real, simulado o mixto) la decide el servidor -->
          <span class="insignia insignia-simulado" id="insignia-cabecera" title="Consultando al servidor qué fuentes sirven datos reales y cuáles responden con su simulador de respaldo.">
            <svg class="icono" viewBox="0 0 24 24" aria-hidden="true" style="width:14px;height:14px"><path d="M12 3l9.5 17H2.5L12 3z"/><path d="M12 10v4M12 17h.01"/></svg>
            <span class="insignia-texto-largo">Verificando la procedencia de los datos…</span>
            <span class="insignia-texto-corto">Verificando…</span>
          </span>
          <a class="indicador-fuentes" id="indicador-fuentes" href="#/fuentes" aria-label="Estado de las fuentes" title="Estado de las fuentes de datos">
            <span class="semaforo" aria-hidden="true"></span><span class="indicador-texto">Fuentes</span>
          </a>
          <button type="button" class="boton boton-icono" id="boton-tema" aria-label="Cambiar a modo oscuro" title="Cambiar a modo oscuro">
            <svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
          </button>
        </div>
      </header>
      <main class="contenido" id="contenido" tabindex="-1"></main>
    </div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <!-- Núcleo (en este orden) -->
  <script src="js/util.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>

  <!-- Módulos -->
  <script src="js/modulos/acceso.js"></script>
  <script src="js/modulos/panel.js"></script>
  <script src="js/modulos/consultas.js"></script>
  <script src="js/modulos/mapa.js"></script>
  <script src="js/modulos/series.js"></script>
  <script src="js/modulos/perfiles.js"></script>
  <script src="js/modulos/comparar.js"></script>
  <script src="js/modulos/reportes.js"></script>
  <script src="js/modulos/vistas.js"></script>
  <script src="js/modulos/fuentes.js"></script>
  <script src="js/modulos/admin.js"></script>
  <script src="js/modulos/acerca.js"></script>
</body>
</html>
